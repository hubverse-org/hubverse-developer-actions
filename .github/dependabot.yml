version: 2
updates:
  - package-ecosystem: github-actions
    # "/*" covers each top-level template directory, where Dependabot reads
    # every YAML file as a workflow or composite action.
    directories:
      - "/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name
